replicaCount: 2

image:
  repository: ghcr.io/example/inventory-api
  # Defaults to the chart's appVersion. CI sets this to the commit SHA.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  #  - host: inventory.example.com
  #    paths: ["/"]
  tls: []

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Spread replicas across zones and nodes when the cluster has them.
topologySpread:
  enabled: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

env: {}

nodeSelector: {}
tolerations: []
affinity: {}

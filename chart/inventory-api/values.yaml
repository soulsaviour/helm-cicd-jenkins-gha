replicaCount: 2

image:
  repository: ghcr.io/example/inventory-api
  # Defaults to the chart's appVersion. CI sets this to the commit SHA.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

env: {}

nodeSelector: {}
tolerations: []
affinity: {}
